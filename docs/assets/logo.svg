<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Enterprise AI Lab">
  <style>
    .glass { fill: none; stroke: #0b5e4f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .liquid { fill: #2e9a76; }
    .shine { fill: #8fd8b9; opacity: .55; }
    .bubble { fill: #bfe8d6; }
    @media (prefers-reduced-motion: no-preference) {
      .bubble { animation: rise 4.8s ease-in-out infinite; }
      .b2 { animation-delay: 1.6s; }
      .b3 { animation-delay: 3.2s; }
      @keyframes rise {
        0%   { transform: translateY(0);    opacity: 0; }
        20%  { opacity: 1; }
        80%  { opacity: .9; }
        100% { transform: translateY(-9px); opacity: 0; }
      }
    }
  </style>
  <!-- Flüssigkeit im unteren Kolben -->
  <path class="liquid" d="M14.6 28.5 H33.4 L38.2 37.2 Q39.8 41 35.6 41 H12.4 Q8.2 41 9.8 37.2 Z"/>
  <path class="shine" d="M13.6 31 Q20 29.6 24 30.6 Q19 31.6 12.6 33 Z"/>
  <!-- Blasen -->
  <circle class="bubble" cx="20" cy="36.5" r="1.6"/>
  <circle class="bubble b2" cx="26.5" cy="35" r="1.3"/>
  <circle class="bubble b3" cx="23.5" cy="38" r="1.1"/>
  <!-- Kolben -->
  <path class="glass" d="M17.5 5.5 H30.5 M20 5.5 V18 L9.6 37 Q8 41 12.4 41 H35.6 Q40 41 38.4 37 L28 18 V5.5"/>
</svg>
